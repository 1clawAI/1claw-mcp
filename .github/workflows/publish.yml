name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - run: npm install

            - run: npm run build

            # Trusted Publishing (OIDC): configure each package at npmjs.com → Package
            # Settings → Trusted Publisher (GitHub Actions: 1clawAI/1claw-mcp, this workflow).
            # Do not set NODE_AUTH_TOKEN — an expired granular token overrides OIDC and yields E404.
            - run: npm publish --provenance --access public

            - name: Extract version
              id: version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

    publish-registry:
        name: Publish to MCP Registry
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install mcp-publisher
              run: |
                  curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
                  chmod +x mcp-publisher

            - name: Validate server.json
              run: ./mcp-publisher validate server.json

            - name: Authenticate to MCP Registry (GitHub OIDC)
              run: ./mcp-publisher login github-oidc

            - name: Publish server to MCP Registry
              run: ./mcp-publisher publish server.json

    update-homebrew:
        name: Update Homebrew Tap
        runs-on: ubuntu-latest
        needs: publish
        if: needs.publish.outputs.version != ''
        steps:
            - name: Trigger formula update
              run: |
                  curl -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
                    https://api.github.com/repos/1clawAI/homebrew-tap/dispatches \
                    -d '{
                      "event_type": "update-formula",
                      "client_payload": {
                        "package": "mcp",
                        "version": "${{ needs.publish.outputs.version }}"
                      }
                    }'
